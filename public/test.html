<!DOCTYPE html>
<html>
<head>
  <title>Image Inspector</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .card { background: #222; border: 1px solid #333; padding: 10px; border-radius: 10px; text-align: center; }
    img { max-width: 100%; max-height: 200px; object-fit: contain; }
    h3 { margin: 10px 0 5px 0; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Image Inspector</h1>
  <div class="grid">
    <script>
      const list = [
        'image54.jpeg', 'image55.jpeg', 'image56.jpeg', 'image57.jpeg',
        'image58.png', 'image59.png', 'image60.jpeg', 'image61.jpeg',
        'image62.jpeg', 'image63.jpeg', 'image64.jpeg', 'image65.jpeg',
        'image66.jpeg', 'image67.jpeg', 'image68.png', 'image69.jpeg',
        'image70.jpeg', 'image71.jpeg'
      ];
      list.forEach(name => {
        document.write(`
          <div class="card">
            <img src="/media/${name}" alt="${name}">
            <h3>${name}</h3>
          </div>
        `);
      });
    </script>
  </div>
</body>
</html>
